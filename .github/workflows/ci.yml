name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (build & test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DemoEnglish.slnx

      - name: Build
        run: dotnet build DemoEnglish.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test DemoEnglish.slnx --configuration Release --no-build --verbosity normal

      - name: Build SWA Functions
        run: dotnet build api/DemoEnglish.Functions.csproj --configuration Release --no-restore

  frontend:
    name: Frontend (typecheck & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Placeholder origin so production builds do not warn about a missing API base.
          VITE_API_BASE_URL: https://example.invalid
